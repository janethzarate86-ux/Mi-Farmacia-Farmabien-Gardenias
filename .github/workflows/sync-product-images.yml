name: Sincronizar imágenes de productos

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: macroxel-image-catalog
  cancel-in-progress: false

jobs:
  sync-images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: image-bot/package.json

      - name: Instalar dependencias
        working-directory: image-bot
        run: npm install --no-audit --no-fund

      - name: Buscar y actualizar imágenes
        env:
          MAX_IMAGE_LOOKUPS: '120'
        run: node image-bot/sync-product-images.mjs

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo-imagenes.json assets/products macroxel-config.json
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos de imágenes."
            exit 0
          fi
          git commit -m "Actualizar catálogo automático de imágenes"
          git push
