name: Verificar sitio publicado en raiz

on:
  push:
    paths:
      - '.github/workflows/verify-published-root.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar Pages a raiz y probar sitio real
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          SITE="https://janethzarate86-ux.github.io/Mi-Farmacia-Farmabien-Gardenias/"
          : > PUBLISHED_TEST.txt
          echo "SITE=$SITE" >> PUBLISHED_TEST.txt

          echo "Consultando GitHub Pages..."
          GET_CODE=$(curl -sS -o /tmp/pages-get.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "PAGES_GET_HTTP=$GET_CODE" >> PUBLISHED_TEST.txt
          cat /tmp/pages-get.json >> PUBLISHED_TEST.txt
          echo >> PUBLISHED_TEST.txt

          echo "Forzando Pages a main /(root)..."
          PUT_CODE=$(curl -sS -o /tmp/pages-put.json -w '%{http_code}' \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"main","path":"/"}}')
          echo "PAGES_PUT_HTTP=$PUT_CODE" >> PUBLISHED_TEST.txt
          cat /tmp/pages-put.json >> PUBLISHED_TEST.txt
          echo >> PUBLISHED_TEST.txt

          HTML_OK=0
          for i in $(seq 1 30); do
            URL="${SITE}?verify=$(date +%s)-$i"
            CODE=$(curl -L -sS -o /tmp/site.html -w '%{http_code}' "$URL")
            if [ "$CODE" = "200" ] && grep -q 'root-single-index-v1.8.1' /tmp/site.html; then
              HTML_OK=1
              echo "HTML_PUBLICADO_OK intento=$i" >> PUBLISHED_TEST.txt
              break
            fi
            echo "espera=$i http=$CODE" >> PUBLISHED_TEST.txt
            sleep 4
          done

          if [ "$HTML_OK" != "1" ]; then
            echo "RESULT=FAIL_HTML" >> PUBLISHED_TEST.txt
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=html" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          if [ -z "$CHROME" ]; then
            echo "RESULT=FAIL_NO_CHROME" >> PUBLISHED_TEST.txt
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_chrome" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "CHROME=$CHROME" >> PUBLISHED_TEST.txt
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=45000 \
            --dump-dom "${SITE}?browser=$(date +%s)" > /tmp/dom.html 2>/tmp/chrome.err
          CHROME_CODE=$?
          echo "CHROME_CODE=$CHROME_CODE" >> PUBLISHED_TEST.txt
          tail -40 /tmp/chrome.err >> PUBLISHED_TEST.txt

          if grep -qi 'HIOSCINA' /tmp/dom.html; then
            COUNT=$(grep -oi 'HIOSCINA' /tmp/dom.html | wc -l | tr -d ' ')
            echo "HIOSCINA_EN_DOM=$COUNT" >> PUBLISHED_TEST.txt
            echo "RESULT=OK" >> PUBLISHED_TEST.txt
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "reason=ok" >> "$GITHUB_OUTPUT"
          else
            echo "RESULT=FAIL_PRODUCTS" >> PUBLISHED_TEST.txt
            grep -o -E '.{0,100}(No se pudo conectar|Cargando catálogo|Sin sincronizar|Firebase|catálogo).{0,180}' /tmp/dom.html | head -20 >> PUBLISHED_TEST.txt || true
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=products" >> "$GITHUB_OUTPUT"
          fi

      - name: Dejar repositorio solo con index si la prueba real paso
        if: steps.verify.outputs.ok == 'true'
        shell: bash
        run: |
          rm -rf .github PUBLISHED_TEST.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SITIO PUBLICADO PRUEBA REAL OK | catalogo visible HIOSCINA"
          git push

      - name: Guardar diagnostico si la prueba real falla
        if: steps.verify.outputs.ok != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PUBLISHED_TEST.txt
          git commit -m "SITIO PUBLICADO PRUEBA FALLIDA | motivo=${{ steps.verify.outputs.reason }}" || true
          git push || true
