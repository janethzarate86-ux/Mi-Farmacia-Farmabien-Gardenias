name: Diagnostico runtime Mi Farmacia

on:
  push:
    paths:
      - '.github/workflows/runtime-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inyectar capturador de errores
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          diag='''<script>\nwindow.addEventListener('error',function(e){try{document.documentElement.setAttribute('data-js-error',String(e.message||'error')+' @ '+String(e.lineno||0)+':'+String(e.colno||0));}catch(_){}});\nwindow.addEventListener('unhandledrejection',function(e){try{document.documentElement.setAttribute('data-js-rejection',String(e.reason&&e.reason.message||e.reason||'rejection'));}catch(_){}});\n</script>'''
          s=s.replace('<head>','<head>'+diag,1)
          p.write_text(s,encoding='utf-8')
      - name: Ejecutar navegador y guardar diagnostico
        shell: bash
        run: |
          set +e
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=30000 --dump-dom "http://127.0.0.1:8765/index.html?diag=$(date +%s)" >/tmp/dom.html 2>/tmp/chrome.err
          python3 - <<'PY' > RUNTIME_DIAGNOSTIC.txt
          import re,html
          s=open('/tmp/dom.html',encoding='utf-8',errors='ignore').read()
          root=re.search(r'<html([^>]*)>',s,re.I|re.S)
          attrs=root.group(1) if root else ''
          for name in ['data-js-error','data-js-rejection']:
              m=re.search(name+r'="([^"]*)"',attrs,re.I)
              print(name+'='+html.unescape(m.group(1) if m else ''))
          for key in ['emptyMessage','connectionState','connectionCatalog','storeName']:
              m=re.search(r'id=["\']'+re.escape(key)+r'["\'][^>]*>(.*?)</[^>]+>',s,re.S|re.I)
              val=html.unescape(re.sub(r'<[^>]+>',' ',m.group(1) if m else '')).strip()
              print(key+'='+val)
          print('HIOSCINA_COUNT='+str(len(re.findall('HIOSCINA',s,re.I))))
          print('PRODUCT_CARD_COUNT='+str(len(re.findall('class="product-card',s,re.I))))
          PY
          echo "--- CHROME STDERR ---" >> RUNTIME_DIAGNOSTIC.txt
          tail -40 /tmp/chrome.err >> RUNTIME_DIAGNOSTIC.txt
      - name: Guardar diagnostico
        shell: bash
        run: |
          git checkout -- index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RUNTIME_DIAGNOSTIC.txt
          git commit -m "DIAGNOSTICO RUNTIME Mi Farmacia"
          git push
