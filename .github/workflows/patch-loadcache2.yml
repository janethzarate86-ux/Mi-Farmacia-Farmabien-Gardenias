name: Aplicar parche runtime directo v3

on:
  push:
    paths:
      - '.github/workflows/patch-loadcache2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insertar función faltante de caché
        id: patch
        shell: python
        run: |
          from pathlib import Path
          import re, os
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          result=[]
          if 'function loadCatalogCache()' in s:
              result.append('LOAD_CACHE=YA_EXISTE')
          else:
              pattern=r'(  function saveCatalogCache\(productos,meta\)\{.*?\n  \}\n)'
              fn="""  function loadCatalogCache(){
    const cache=readJsonStorage(STORAGE_CATALOG,null);
    if(!cache||Number(cache?.version||0)!==2||!cache?.productos||typeof cache.productos!=='object') return null;
    return cache;
  }
"""
              s,n=re.subn(pattern,lambda m:m.group(1)+fn,s,count=1,flags=re.S)
              if n!=1:
                  result.append('LOAD_CACHE=NO_INSERTADO')
                  Path('PATCH_RESULT.txt').write_text('\n'.join(result)+'\n',encoding='utf-8')
                  raise SystemExit('No se encontró saveCatalogCache')
              result.append('LOAD_CACHE=INSERTADO')
          s=s.replace('root-single-index-v1.8.1','root-single-index-v1.8.2-cachefix',1)
          p.write_text(s,encoding='utf-8')
          result.append('BUILD_CACHEFIX='+str('root-single-index-v1.8.2-cachefix' in s))
          Path('PATCH_RESULT.txt').write_text('\n'.join(result)+'\n',encoding='utf-8')

      - name: Validar sintaxis y navegador
        shell: bash
        run: |
          set -e
          grep -q 'function loadCatalogCache()' index.html
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=35000 --dump-dom "http://127.0.0.1:8765/index.html?patch=$(date +%s)" >/tmp/dom.html 2>/tmp/chrome.err
          COUNT=$(grep -oi 'HIOSCINA' /tmp/dom.html | wc -l | tr -d ' ')
          CARDS=$(grep -oi 'class="product-card' /tmp/dom.html | wc -l | tr -d ' ')
          echo "HIOSCINA_COUNT=$COUNT" >> PATCH_RESULT.txt
          echo "PRODUCT_CARD_COUNT=$CARDS" >> PATCH_RESULT.txt
          if [ "$COUNT" -lt 1 ] || [ "$CARDS" -lt 10 ]; then
            echo "BROWSER=FAIL" >> PATCH_RESULT.txt
            exit 1
          fi
          echo "BROWSER=OK" >> PATCH_RESULT.txt

      - name: Guardar corrección si pasa
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html PATCH_RESULT.txt
          git commit -m "Corregir runtime: loadCatalogCache restaurada | navegador OK"
          git push

      - name: Guardar diagnóstico si falla
        if: failure()
        shell: bash
        run: |
          git checkout -- index.html || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -f PATCH_RESULT.txt || echo 'PATCH=FAIL_SIN_RESULTADO' > PATCH_RESULT.txt
          git add PATCH_RESULT.txt
          git commit -m "Parche runtime fallido: diagnóstico" || true
          git push || true
