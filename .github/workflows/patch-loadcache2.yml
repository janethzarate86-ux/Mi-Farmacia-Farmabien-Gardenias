name: Aplicar parche runtime directo v2

on:
  push:
    paths:
      - '.github/workflows/patch-loadcache2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insertar función de caché faltante
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'function loadCatalogCache()' not in s:
              marker="""  function saveCatalogCache(productos,meta){
    writeJsonStorage(STORAGE_CATALOG,{version:2,storeId:state.storeId,revision:Number(meta?.revision||0)||0,baseRevision:Number(meta?.baseRevision||0)||0,actualizadoEn:text(meta?.actualizadoEn),productos});
  }
"""
              fn="""  function loadCatalogCache(){
    const cache=readJsonStorage(STORAGE_CATALOG,null);
    if(!cache||Number(cache?.version||0)!==2||!cache?.productos||typeof cache.productos!=='object') return null;
    return cache;
  }
"""
              if marker not in s:
                  raise SystemExit('No se encontró saveCatalogCache')
              s=s.replace(marker,marker+fn,1)
          s=s.replace('root-single-index-v1.8.1','root-single-index-v1.8.2-cachefix',1)
          p.write_text(s,encoding='utf-8')

      - name: Guardar parche
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corregir runtime: loadCatalogCache restaurada"
          git push
