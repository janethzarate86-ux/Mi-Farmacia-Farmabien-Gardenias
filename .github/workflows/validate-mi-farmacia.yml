name: Validar Mi Farmacia limpia

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validar estructura y JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/mi-farmacia.css
          test -f docs/mi-farmacia.js
          test -f docs/macroxel-config.json
          test -f docs/catalogo-imagenes.json
          test -f docs/image-bot/package.json
          test -f docs/image-bot/sync-product-images.mjs
          grep -q 'mi-farmacia.css?v=170' docs/index.html
          grep -q 'mi-farmacia.js?v=170' docs/index.html
          grep -q "new URL('macroxel-config.json',document.baseURI)" docs/mi-farmacia.js
          grep -q 'mi_farmacia/catalogo/' docs/mi-farmacia.js
          grep -q 'renderProducts' docs/mi-farmacia.js
          if grep -q 'loadCatalogCache is not defined' docs/mi-farmacia.js; then exit 1; fi
          node --check docs/mi-farmacia.js
          node --check docs/image-bot/sync-product-images.mjs

      - name: Probar conexión real y catálogo Firebase
        shell: python
        run: |
          import json, urllib.request, urllib.parse
          from pathlib import Path

          cfg=json.loads(Path('docs/macroxel-config.json').read_text(encoding='utf-8'))
          assert int(cfg.get('version',0)) >= 2, cfg
          base=str(cfg.get('firebaseUrl','')).rstrip('/')
          store=str(cfg.get('tiendaId','')).strip()
          assert base.startswith('https://') and store

          def get(path):
              url=f"{base}/{path.strip('/')}.json"
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'Macroxel-GitHub-Validation/1.0'})
              with urllib.request.urlopen(req,timeout=40) as r:
                  raw=r.read().decode('utf-8')
                  assert r.status==200, (r.status,url)
                  return json.loads(raw) if raw else None

          tienda=get(f"mi_farmacia/tiendas/{urllib.parse.quote(store,safe='')}") or {}
          meta=get(f"mi_farmacia/catalogo/{urllib.parse.quote(store,safe='')}/meta") or {}
          productos=get(f"mi_farmacia/catalogo/{urllib.parse.quote(store,safe='')}/productos") or {}

          assert isinstance(tienda,dict) and tienda, 'Tienda vacía'
          assert isinstance(meta,dict) and int(meta.get('version',0))==2, meta
          revision=int(meta.get('revision',0) or 0)
          assert revision>0, meta
          assert isinstance(productos,dict), type(productos)
          cantidad=len(productos)
          assert cantidad>0, 'Catálogo sin productos'
          assert str(tienda.get('clavePedidosId','')).strip(), 'Falta clavePedidosId'
          assert str(tienda.get('claveFirmaCatalogoId','')).strip(), 'Falta claveFirmaCatalogoId'
          assert isinstance(tienda.get('clavePublicaFirmaCatalogo'),dict), 'Falta clave pública de firma'
          firma=meta.get('firmaCatalogo') or {}
          assert isinstance(firma,dict) and firma.get('value'), 'Falta firma del catálogo'
          print(f'VALIDACION_OK tienda={store} productos={cantidad} revision={revision}')
