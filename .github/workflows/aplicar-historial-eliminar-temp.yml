name: Aplicar borrado protegido del historial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-historial-eliminar-temp.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar cambio al visor
        run: python tools/patch_historial_eliminar_temp.py
      - name: Guardar visor actualizado
        run: |
          git config user.name "Macroxel Update"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "Agrega borrado protegido al historial de pedidos"
            git push
          fi
