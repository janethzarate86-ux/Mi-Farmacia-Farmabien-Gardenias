name: Proceso pedido Mi Farmacia

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/proceso-pedido-mi-farmacia.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agregar seguimiento SURTIENDO SURTIDO CANCELADO y voz
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          s=p.read_text(encoding='utf-8')
          if 'function speakOrderStatus' in s and "return e==='EN_PROCESO'?'SURTIENDO'" in s:
              print('Seguimiento ya instalado.')
              raise SystemExit(0)

          old="  function localOrderDate(raw){try{return new Date(raw).toLocaleString('es-MX',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(_){return raw||'—'}}\n  function renderOrderHistory(){"
          new="""  function localOrderDate(raw){try{return new Date(raw).toLocaleString('es-MX',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(_){return raw||'—'}}
          function publicOrderStatusLabel(estado=''){const e=text(estado||'NUEVO').toUpperCase();return e==='EN_PROCESO'?'SURTIENDO':e.replace(/_/g,' ')}
          function orderVoiceText(estado=''){
            const e=text(estado).toUpperCase();
            if(e==='EN_PROCESO')return 'Tu pedido se está surtiendo. La farmacia ya está preparando tus productos.';
            if(e==='SURTIDO')return 'Pedido surtido, favor de estar atento en el punto de encuentro.';
            if(e==='CANCELADO')return 'Tu pedido fue cancelado por la farmacia.';
            return '';
          }
          function speakOrderStatus(estado=''){
            const mensaje=orderVoiceText(estado);if(!mensaje||!('speechSynthesis'in window)||typeof SpeechSynthesisUtterance==='undefined')return;
            try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(mensaje);u.lang='es-MX';u.rate=.95;u.pitch=1;u.volume=1;const voces=window.speechSynthesis.getVoices?.()||[];const voz=voces.find(v=>String(v.lang||'').toLowerCase()==='es-mx')||voces.find(v=>String(v.lang||'').toLowerCase().startsWith('es'));if(voz)u.voice=voz;window.speechSynthesis.speak(u)}catch(_){}
          }
          function renderOrderHistory(){"""
          assert old in s, 'No se encontró ancla localOrderDate'
          s=s.replace(old,new,1)

          old="""    cont.innerHTML=rows.slice(0,5).map(o=>{const estado=text(o.estado||'NUEVO').toUpperCase();const tipo=o.entrega?.tipo==='DOMICILIO'?'Entrega a domicilio':'Recoger en sucursal';return `<div class=\"order-history-item\"><div><strong>${esc(o.id)}</strong><small>${esc(localOrderDate(o.createdAt))} · ${esc(tipo)}<br>${esc(o.mensaje||'Pedido enviado a la farmacia.')}</small></div><span class=\"order-status-pill ${esc(estado.toLowerCase().replace(/_/g,'-'))}\">${esc(estado.replace(/_/g,' '))}</span></div>`}).join('');"""
          new="""    cont.innerHTML=rows.slice(0,5).map(o=>{const estado=text(o.estado||'NUEVO').toUpperCase();const tipo=o.entrega?.tipo==='DOMICILIO'?'Entrega a domicilio':'Recoger en sucursal';return `<div class=\"order-history-item\"><div><strong>${esc(o.id)}</strong><small>${esc(localOrderDate(o.createdAt))} · ${esc(tipo)}<br>${esc(o.mensaje||'Pedido enviado a la farmacia.')}</small></div><span class=\"order-status-pill ${esc(estado.toLowerCase().replace(/_/g,'-'))}\">${esc(publicOrderStatusLabel(estado))}</span></div>`}).join('');"""
          assert old in s, 'No se encontró renderOrderHistory'
          s=s.replace(old,new,1)

          old="""if(next!==before){changed=true;const msg=o.mensaje||`El pedido ${o.id} cambió a ${next}.`;toast(msg);if('Notification'in window&&Notification.permission==='granted'){try{new Notification('Mi Farmacia',{body:msg,tag:`pedido-${o.id}`})}catch(_){}}}"""
          new="""if(next!==before){changed=true;const msg=o.mensaje||`El pedido ${o.id} cambió a ${publicOrderStatusLabel(next)}.`;toast(msg);speakOrderStatus(next);if('Notification'in window&&Notification.permission==='granted'){try{new Notification('Mi Farmacia',{body:msg,tag:`pedido-${o.id}`})}catch(_){}}}"""
          assert old in s, 'No se encontró cambio de estado'
          s=s.replace(old,new,1)

          old="      setInterval(()=>{if(document.visibilityState==='visible'&&navigator.onLine)refreshOrderStatuses()},ORDER_STATUS_POLL_MS);"
          new="      setInterval(()=>{if(navigator.onLine)refreshOrderStatuses()},ORDER_STATUS_POLL_MS);"
          assert old in s, 'No se encontró polling de estados'
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          print('Seguimiento instalado.')
          PY
      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "janethzarate86-ux"
          git config user.email "janeth.zarate86@gmail.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "Agrega seguimiento de surtido y voz al cliente"
            git push
          fi
