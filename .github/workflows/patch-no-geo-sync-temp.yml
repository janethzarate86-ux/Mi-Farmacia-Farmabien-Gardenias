name: Corregir visor sin ubicacion y recuperacion catalogo
on:
  push:
    paths:
      - 'tools/patch-no-geo-sync-temp.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcciones
        run: python tools/patch-no-geo-sync-temp.py
      - name: Validar cambios
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('docs/index.html').read_text(encoding='utf-8')
          for x in ['navigator.geolocation','requestLocationOnActivation','validateDeliveryLocation','ensureDeliveryLocation','Datos publicados desde Macroxel FarmaControl. No son editables desde este visor.','La conexión se recibe desde la configuración central generada por el sistema principal.']:
              assert x not in s, x
          assert 'aproximadamente dentro de 1 km' in s
          assert "metaResultado.status==='fulfilled'" in s
          assert 'FIREBASE_CATALOG_TIMEOUT_MS = 15000' in s
          PY
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Quita geolocalizacion y mejora recuperacion del catalogo" || exit 0
          git push
