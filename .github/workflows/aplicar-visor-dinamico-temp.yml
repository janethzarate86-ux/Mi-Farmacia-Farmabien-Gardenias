name: Aplicar visor dinamico Mi Farmacia

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-visor-dinamico-temp.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar visor para resolver la farmacia desde Firebase
        run: python tools/patch_visor_dinamico_temp.py
      - name: Guardar cambios
        run: |
          git config user.name "Macroxel Update"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "Visor Mi Farmacia sigue la publicacion activa de Firebase"
            git push
          fi
