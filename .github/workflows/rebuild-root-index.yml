name: Probar y reconstruir index unico

on:
  push:
    paths:
      - '.github/workflows/rebuild-root-index.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruir y probar
        id: test
        shell: python
        run: |
          from pathlib import Path
          import json, re, shutil, subprocess, tempfile, urllib.request, urllib.parse, os, traceback

          result = {'ok': False, 'stage': 'inicio', 'products': 0, 'revision': 0, 'error': ''}
          try:
              result['stage'] = 'archivos'
              src = Path('docs/index.html')
              cfgp = Path('docs/macroxel-config.json')
              if not src.exists(): raise RuntimeError('Falta docs/index.html')
              if not cfgp.exists(): raise RuntimeError('Falta docs/macroxel-config.json')
              s = src.read_text(encoding='utf-8')
              cfg = json.loads(cfgp.read_text(encoding='utf-8'))
              for key in ('firebaseUrl','githubUrl','tiendaId'):
                  if not str(cfg.get(key,'')).strip(): raise RuntimeError('Configuracion incompleta: '+key)

              result['stage'] = 'transformacion'
              embedded = json.dumps(cfg, ensure_ascii=False, separators=(',',':')).replace('<','\\u003c')
              tag = '<script id="macroxel-runtime-config" type="application/json">'+embedded+'</script>'
              if 'id="macroxel-runtime-config"' not in s:
                  if '</head>' not in s: raise RuntimeError('No existe cierre head')
                  s = s.replace('</head>', tag+'\n</head>', 1)

              old = "const u=new URL('macroxel-config.json',document.baseURI);"
              new = "const u={href:'data:application/json;charset=utf-8,'+encodeURIComponent(document.getElementById('macroxel-runtime-config').textContent)};"
              if old not in s: raise RuntimeError('No se encontro lectura de macroxel-config.json')
              s = s.replace(old, new, 1)
              s = re.sub(r'(<meta name="mi-farmacia-build" content=")[^"]+("[^>]*>)', r'\1root-single-index-v1.8.1\2', s, count=1)
              Path('index.html').write_text(s, encoding='utf-8')

              result['stage'] = 'javascript'
              blocks = re.findall(r'<script([^>]*)>(.*?)</script>', s, flags=re.S|re.I)
              checked = 0
              for i,(attrs,code) in enumerate(blocks):
                  if 'application/json' in attrs.lower() or not code.strip(): continue
                  p = Path(tempfile.gettempdir()) / ('macroxel-check-%d.js' % i)
                  p.write_text(code, encoding='utf-8')
                  cp = subprocess.run(['node','--check',str(p)], text=True, capture_output=True)
                  if cp.returncode != 0:
                      raise RuntimeError('JavaScript invalido bloque %d: %s' % (i, (cp.stderr or cp.stdout)[-1200:]))
                  checked += 1
              if checked < 1: raise RuntimeError('No se valido ningun bloque JavaScript')

              result['stage'] = 'firebase'
              base = str(cfg['firebaseUrl']).rstrip('/')
              store = str(cfg['tiendaId']).strip()
              def get(path):
                  url = base+'/'+path.strip('/')+'.json'
                  req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'Macroxel-Test/1.0'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read().decode('utf-8')
                      if r.status != 200: raise RuntimeError('HTTP %s en %s' % (r.status,path))
                      return json.loads(raw) if raw else None
              pub = get('mi_farmacia/publicacion') or {}
              tienda = get('mi_farmacia/tiendas/'+urllib.parse.quote(store,safe='')) or {}
              meta = get('mi_farmacia/catalogo/'+urllib.parse.quote(store,safe='')+'/meta') or {}
              products = get('mi_farmacia/catalogo/'+urllib.parse.quote(store,safe='')+'/productos') or {}
              result['products'] = len(products) if isinstance(products,dict) else 0
              result['revision'] = int(meta.get('revision') or 0) if isinstance(meta,dict) else 0
              if not pub: raise RuntimeError('Publicacion vacia')
              if not tienda: raise RuntimeError('Tienda vacia')
              if result['products'] < 1: raise RuntimeError('Catalogo sin productos')
              if result['revision'] < 1: raise RuntimeError('Catalogo sin revision')

              result['stage'] = 'http-local'
              # Comprobacion estructural final del archivo unico.
              if 'root-single-index-v1.8.1' not in s: raise RuntimeError('Build final no identificado')
              if "new URL('macroxel-config.json'" in s: raise RuntimeError('Sigue dependiendo de config externo')
              if 'macroxel-runtime-config' not in s: raise RuntimeError('Config no incrustada')

              result['ok'] = True
              result['stage'] = 'ok'
          except Exception as e:
              result['error'] = str(e)
              print(traceback.format_exc())

          Path('ACTION_RESULT.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('ok='+('true' if result['ok'] else 'false')+'\n')
              f.write('products=%s\n' % result['products'])
              f.write('revision=%s\n' % result['revision'])
              f.write('stage=%s\n' % result['stage'])

      - name: Publicar si todas las pruebas pasan
        if: steps.test.outputs.ok == 'true'
        shell: bash
        run: |
          rm -rf docs .github ACTION_RESULT.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ROOT INDEX PRUEBAS OK | productos=${{ steps.test.outputs.products }} revision=${{ steps.test.outputs.revision }}"
          git push

      - name: Registrar diagnostico si falla
        if: steps.test.outputs.ok != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ACTION_RESULT.json
          git commit -m "ROOT INDEX PRUEBA FALLIDA | etapa=${{ steps.test.outputs.stage }}" || true
          git push || true

      - name: Cambiar Pages a raiz si paso
        if: steps.test.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl -sS -o /tmp/pages.json -w 'HTTP %{http_code}\n' \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"main","path":"/"}}' || true
          cat /tmp/pages.json || true
