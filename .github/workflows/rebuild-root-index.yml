name: Reconstruir Mi Farmacia como index unico

on:
  push:
    paths:
      - '.github/workflows/rebuild-root-index.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  rebuild-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir index unico en raiz
        shell: python
        run: |
          from pathlib import Path
          import json, re, shutil

          src = Path('docs/index.html')
          cfgp = Path('docs/macroxel-config.json')
          if not src.exists():
              raise SystemExit('Falta docs/index.html')
          if not cfgp.exists():
              raise SystemExit('Falta docs/macroxel-config.json')

          s = src.read_text(encoding='utf-8')
          cfg = json.loads(cfgp.read_text(encoding='utf-8'))
          required = ['firebaseUrl','githubUrl','tiendaId']
          missing = [k for k in required if not str(cfg.get(k,'')).strip()]
          if missing:
              raise SystemExit('Configuracion incompleta: ' + ', '.join(missing))

          embedded = json.dumps(cfg, ensure_ascii=False, separators=(',',':')).replace('<','\\u003c')
          tag = '<script id="macroxel-runtime-config" type="application/json">' + embedded + '</script>'
          if 'id="macroxel-runtime-config"' not in s:
              s = s.replace('</head>', '  ' + tag + '\n</head>', 1)

          pattern = r"const u=new URL\('macroxel-config\\.json',document\\.baseURI\);"
          replacement = "const u={href:'data:application/json;charset=utf-8,'+encodeURIComponent(document.getElementById('macroxel-runtime-config').textContent)};"
          s, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit('No se encontro la lectura externa de macroxel-config.json')

          # Evitar que un manifiesto externo de imagenes pueda bloquear el arranque del catalogo.
          s = re.sub(r"await\s+loadMasterImageCatalog\([^;]*\);", "void 0;", s)
          s = re.sub(r'(<meta name="mi-farmacia-build" content=")[^"]+("/?>)', r'\\1root-single-index-v1.8.0-tested\\2', s, count=1)

          Path('index.html').write_text(s, encoding='utf-8')

          # El destino final solicitado es un solo index en la raiz.
          if Path('docs').exists():
              shutil.rmtree('docs')

      - name: Validar HTML y JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          s = Path('index.html').read_text(encoding='utf-8')
          if '<html' not in s.lower() or '</html>' not in s.lower():
              raise SystemExit('HTML incompleto')
          if 'macroxel-runtime-config' not in s:
              raise SystemExit('No se incrusto la configuracion')
          if "new URL('macroxel-config.json'" in s:
              raise SystemExit('El index aun depende de macroxel-config.json')
          scripts = re.findall(r'<script(?![^>]*type=["\']application/json["\'])[^>]*>(.*?)</script>', s, flags=re.S|re.I)
          checked = 0
          for i, code in enumerate(scripts):
              if not code.strip():
                  continue
              p = Path(tempfile.gettempdir()) / f'macroxel-inline-{i}.js'
              p.write_text(code, encoding='utf-8')
              subprocess.run(['node','--check',str(p)], check=True)
              checked += 1
          if checked == 0:
              raise SystemExit('No se encontraron scripts ejecutables para validar')
          print(f'JavaScript valido: {checked} bloques')

      - name: Probar Firebase y confirmar productos reales
        id: firebase_test
        shell: python
        run: |
          import json, urllib.request, urllib.parse, pathlib, re, os
          s = pathlib.Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<script id="macroxel-runtime-config" type="application/json">(.*?)</script>', s, re.S)
          if not m:
              raise SystemExit('Configuracion incrustada no encontrada')
          cfg = json.loads(m.group(1))
          base = cfg['firebaseUrl'].rstrip('/')
          store = cfg['tiendaId']
          def get(path):
              url = base + '/' + path.strip('/') + '.json'
              req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'Macroxel-GitHub-Test/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  if r.status != 200:
                      raise SystemExit(f'HTTP {r.status} en {path}')
                  return json.loads(r.read().decode('utf-8'))
          pub = get('mi_farmacia/publicacion') or {}
          tienda = get('mi_farmacia/tiendas/' + urllib.parse.quote(store, safe='')) or {}
          meta = get('mi_farmacia/catalogo/' + urllib.parse.quote(store, safe='') + '/meta') or {}
          productos = get('mi_farmacia/catalogo/' + urllib.parse.quote(store, safe='') + '/productos') or {}
          count = len(productos) if isinstance(productos, dict) else 0
          revision = int(meta.get('revision') or 0) if isinstance(meta, dict) else 0
          if count <= 0:
              raise SystemExit('Firebase respondio pero el catalogo no contiene productos')
          if revision <= 0:
              raise SystemExit('Meta de catalogo sin revision valida')
          if not isinstance(tienda, dict) or not tienda:
              raise SystemExit('No existe la tienda publicada')
          print('PUBLICACION_OK', bool(pub))
          print('TIENDA_OK', bool(tienda))
          print('REVISION', revision)
          print('PRODUCTOS', count)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f'products={count}\nrevision={revision}\n')

      - name: Probar index local por HTTP
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/macroxel-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..10}; do
            curl -fsS http://127.0.0.1:8765/index.html -o /tmp/index-check.html && break
            sleep 1
          done
          grep -q 'root-single-index-v1.8.0-tested' /tmp/index-check.html
          grep -q 'macroxel-runtime-config' /tmp/index-check.html

      - name: Guardar version probada en raiz
        shell: bash
        run: |
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mi Farmacia root index OK | productos=${{ steps.firebase_test.outputs.products }} revision=${{ steps.firebase_test.outputs.revision }}"
          git push

      - name: Cambiar GitHub Pages a raiz
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          CODE=$(curl -sS -o /tmp/pages-response.json -w '%{http_code}' \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"source":{"branch":"main","path":"/"}}')
          echo "Pages API HTTP $CODE"
          cat /tmp/pages-response.json || true
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "No fue posible cambiar Pages automaticamente; el index ya quedo probado en raiz."
          fi
