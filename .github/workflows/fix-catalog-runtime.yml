name: Corregir y probar carga de catálogo

on:
  push:
    paths:
      - '.github/workflows/fix-catalog-runtime.yml'

permissions:
  contents: write

jobs:
  fix-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Corregir función faltante
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor="""  function saveCatalogCache(productos,meta){
    writeJsonStorage(STORAGE_CATALOG,{version:2,storeId:state.storeId,revision:Number(meta?.revision||0)||0,baseRevision:Number(meta?.baseRevision||0)||0,actualizadoEn:text(meta?.actualizadoEn),productos});
  }
"""
          addition="""  function loadCatalogCache(){
    const cache=readJsonStorage(STORAGE_CATALOG,null);
    if(!cache||Number(cache?.version||0)!==2||!cache?.productos||typeof cache.productos!=='object') return null;
    return cache;
  }
"""
          if 'function loadCatalogCache()' not in s:
              if anchor not in s:
                  raise SystemExit('No se encontró el punto seguro para insertar loadCatalogCache')
              s=s.replace(anchor,anchor+addition,1)
          s=s.replace('root-single-index-v1.8.1','root-single-index-v1.8.2-cachefix',1)
          p.write_text(s,encoding='utf-8')

      - name: Validar JavaScript del index y del bot
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          if 'function loadCatalogCache()' not in s:
              raise SystemExit('loadCatalogCache no quedó integrada')
          blocks=re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)
          checked=0
          for i,(attrs,code) in enumerate(blocks):
              if 'application/json' in attrs.lower() or not code.strip():
                  continue
              f=Path(tempfile.gettempdir())/f'mi-farmacia-inline-{i}.js'
              f.write_text(code,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True)
              checked+=1
          if checked<1:
              raise SystemExit('No se validó ningún bloque JavaScript')
          subprocess.run(['node','--check','image-bot/sync-product-images.mjs'],check=True)
          print('BLOQUES_JS_OK=',checked)

      - name: Probar catálogo en navegador local real
        shell: bash
        run: |
          set -e
          python3 -m http.server 8765 >/tmp/http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=35000 --dump-dom "http://127.0.0.1:8765/index.html?local=$(date +%s)" >/tmp/local-dom.html 2>/tmp/local-chrome.err
          grep -qi 'HIOSCINA' /tmp/local-dom.html
          grep -q 'root-single-index-v1.8.2-cachefix' /tmp/local-dom.html
          COUNT=$(grep -oi 'class="product-card' /tmp/local-dom.html | wc -l | tr -d ' ')
          echo "LOCAL_PRODUCT_CARDS=$COUNT"
          if [ "$COUNT" -lt 10 ]; then
            echo "Se esperaban múltiples tarjetas de producto" >&2
            exit 1
          fi

      - name: Guardar corrección validada
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corregir carga catálogo: restaurar loadCatalogCache | prueba local OK"
          git push

      - name: Esperar publicación de GitHub Pages
        shell: bash
        run: |
          set -e
          SITE="https://janethzarate86-ux.github.io/Mi-Farmacia-Farmabien-Gardenias/"
          OK=0
          for i in $(seq 1 30); do
            curl -L -fsS "${SITE}?build=$(date +%s)-$i" -o /tmp/public.html || true
            if grep -q 'root-single-index-v1.8.2-cachefix' /tmp/public.html; then
              OK=1
              echo "PUBLIC_BUILD_OK intento=$i"
              break
            fi
            sleep 4
          done
          test "$OK" = "1"

      - name: Probar productos en sitio público real
        shell: bash
        run: |
          set -e
          SITE="https://janethzarate86-ux.github.io/Mi-Farmacia-Farmabien-Gardenias/"
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=40000 --dump-dom "${SITE}?browser=$(date +%s)" >/tmp/public-dom.html 2>/tmp/public-chrome.err
          grep -qi 'HIOSCINA' /tmp/public-dom.html
          COUNT=$(grep -oi 'class="product-card' /tmp/public-dom.html | wc -l | tr -d ' ')
          echo "PUBLIC_PRODUCT_CARDS=$COUNT"
          if [ "$COUNT" -lt 10 ]; then
            exit 1
          fi

      - name: Limpiar diagnósticos temporales después de aprobar
        shell: bash
        run: |
          rm -f INTEGRATION_TEST.txt RUNTIME_DIAGNOSTIC.txt
          rm -f .github/workflows/integration-test.yml .github/workflows/runtime-diagnostic.yml .github/workflows/fix-catalog-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PRUEBAS OK: catálogo visible en navegador y GitHub Pages"
          git push
