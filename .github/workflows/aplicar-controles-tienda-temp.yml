name: Aplicar imagen y pausa de Mi Farmacia

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-controles-tienda-temp.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar controles
        run: python tools/patch_store_controls_temp.py
      - name: Guardar cambios
        run: |
          git config user.name "Macroxel Update"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "Agrega imagen por sucursal y pausa de mantenimiento"
            git push
          fi
