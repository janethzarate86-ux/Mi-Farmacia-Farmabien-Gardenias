name: Ajustar imagenes Mi Farmacia

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ajustar-imagenes-mi-farmacia.yml'

permissions:
  contents: write

jobs:
  ajustar:
    if: contains(github.event.head_commit.message, 'Instala ajuste temporal imagenes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agrandar imagenes de productos
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')

          patron = re.compile(r'\.product-image\{aspect-ratio:1\.55/1;background:linear-gradient\(145deg,#f2f7fc,#eaf2f9\);display:grid;place-items:center;padding:7px;overflow:hidden\}\.product-image svg,\.product-image img\{width:100%;height:100%;max-width:135px;max-height:88px;object-fit:contain\}')
          reemplazo = '.product-image{aspect-ratio:1.18/1;background:linear-gradient(145deg,#f2f7fc,#eaf2f9);display:grid;place-items:center;padding:14px;overflow:hidden}.product-image svg,.product-image img{width:100%;height:100%;max-width:180px;max-height:148px;object-fit:contain}'
          s, n1 = patron.subn(reemplazo, s, count=1)

          bloque = '@media(min-width:720px){main{padding-left:22px;padding-right:22px}.product-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.product-card{border-radius:21px}.product-body{padding:13px}.modal-card{bottom:50%;transform:translate(-50%,50%);border-radius:24px}.checkout-grid{grid-template-columns:1fr 1fr}}'
          nuevo = '@media(min-width:720px){main{padding-left:22px;padding-right:22px}.product-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.product-card{border-radius:21px}.product-image{aspect-ratio:1.12/1;padding:18px}.product-image svg,.product-image img{max-width:220px;max-height:180px}.product-body{padding:13px}.modal-card{bottom:50%;transform:translate(-50%,50%);border-radius:24px}.checkout-grid{grid-template-columns:1fr 1fr}}'
          if bloque in s:
              s = s.replace(bloque, nuevo, 1)
              n2 = 1
          else:
              n2 = 0

          if n1 != 1 or n2 != 1:
              raise SystemExit(f'No se localizaron los estilos esperados: imagen={n1}, escritorio={n2}')

          p.write_text(s, encoding='utf-8')
      - name: Publicar cambio
        run: |
          git config user.name "Macroxel Automation"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Agrandar imagenes de productos en Mi Farmacia"
          git push
