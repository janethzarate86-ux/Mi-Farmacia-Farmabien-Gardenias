name: Aplicar visor stock e historial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-visor-stock-historial-temp.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar cambios al visor
        run: python tools/patch_viewer_stock_historial_temp.py
      - name: Guardar cambios
        run: |
          git config user.name "Macroxel Update"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "Muestra stock directo y detalle de historial"
            git push
          fi
