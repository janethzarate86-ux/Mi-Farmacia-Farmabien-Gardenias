name: Aplicar seguimiento visible de pedidos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-seguimiento-pedido-temp.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar seguimiento visible
        run: python tools/patch_seguimiento_pedido_temp.py
      - name: Guardar cambios
        run: |
          git config user.name "Macroxel Update"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "Agrega seguimiento visible de pedidos"
            git push
          fi
# Reintento con parche ajustado al visor actual.
