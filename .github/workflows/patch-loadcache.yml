name: Parche loadCatalogCache
on:
  push:
    paths:
      - '.github/workflows/patch-loadcache.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          anchor="""  function saveCatalogCache(productos,meta){
    writeJsonStorage(STORAGE_CATALOG,{version:2,storeId:state.storeId,revision:Number(meta?.revision||0)||0,baseRevision:Number(meta?.baseRevision||0)||0,actualizadoEn:text(meta?.actualizadoEn),productos});
  }
"""
          addition="""  function loadCatalogCache(){
    const cache=readJsonStorage(STORAGE_CATALOG,null);
    if(!cache||Number(cache?.version||0)!==2||!cache?.productos||typeof cache.productos!=='object') return null;
    return cache;
  }
"""
          if 'function loadCatalogCache()' not in s:
              if anchor not in s: raise SystemExit('anchor no encontrado')
              s=s.replace(anchor,anchor+addition,1)
          s=s.replace('root-single-index-v1.8.1','root-single-index-v1.8.2-cachefix',1)
          p.write_text(s,encoding='utf-8')
      - shell: python
        run: |
          from pathlib import Path
          import re,subprocess,tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I)
          n=0
          for i,(attrs,code) in enumerate(blocks):
              if 'application/json' in attrs.lower() or not code.strip(): continue
              f=Path(tempfile.gettempdir())/f'inline-{i}.js';f.write_text(code,encoding='utf-8')
              subprocess.run(['node','--check',str(f)],check=True);n+=1
          print('JS_OK',n)
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Corregir runtime: agregar loadCatalogCache"
          git push
