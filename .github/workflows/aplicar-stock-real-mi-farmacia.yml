name: Aplicar stock real Mi Farmacia

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-stock-real-mi-farmacia.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar existencia real y limites
        shell: python
        run: |
          from pathlib import Path
          path=Path('docs/index.html')
          s=path.read_text(encoding='utf-8')

          def block(start,end,new):
              global s
              i=s.find(start)
              if i<0: raise SystemExit(f'No se encontro inicio: {start}')
              j=s.find(end,i+len(start))
              if j<0: raise SystemExit(f'No se encontro fin: {end}')
              s=s[:i]+new.rstrip()+"\n\n  "+s[j:]

          s=s.replace('/* Mi Farmacia v1.1 · disponibilidad sin exponer existencias */','/* Mi Farmacia v1.8 · disponibilidad y existencia real */',1)
          s=s.replace('.stock-badge.is-out{background:#f4f4f6;color:#6b7280;border-color:#dadde2}', '.stock-badge.is-out{background:#f4f4f6;color:#6b7280;border-color:#dadde2}.stock-badge.is-low{background:#fff4dc;color:#a85b00;border-color:#f3d49a;box-shadow:0 4px 12px rgba(168,91,0,.10)}',1)
          s=s.replace('.availability-inline.is-out{background:#f4f4f6;color:#6b7280;border-color:#dadde2}', '.availability-inline.is-out{background:#f4f4f6;color:#6b7280;border-color:#dadde2}.availability-inline.is-low{background:#fff4dc;color:#a85b00;border-color:#f3d49a}',1)

          block('function normalizeProduct(raw,id){','async function requestAt(base,path,options={}){',r'''function normalizeProduct(raw,id){
            const precio=Math.max(0,Number(raw?.precio||0)||0);
            const activo=raw?.activo!==false;
            const existenciaConocida=raw?.existencia!==undefined && raw?.existencia!==null && Number.isFinite(Number(raw.existencia));
            const existencia=existenciaConocida?Math.max(0,Math.floor(Number(raw.existencia)||0)):(raw?.disponible===false?0:MAX_ORDER_QTY);
            const disponible=activo && existencia>0 && raw?.disponible!==false;
            return {id:text(raw?.id||id),codigo:text(raw?.codigo),generica:text(raw?.generica),distintiva:text(raw?.distintiva),nombre:text(raw?.nombre||[raw?.generica,raw?.distintiva].filter(Boolean).join(' ')),presentacion:text(raw?.presentacion),precio,departamento:text(raw?.departamento||'OTRO'),tipoImagen:text(raw?.tipoImagen),imagenUrl:text(raw?.imagenUrl),imagenClave:text(raw?.imagenClave),imagenModo:text(raw?.imagenModo||'AUTO_EAN'),activo,disponible,existencia,existenciaConocida};
          }
          function stockInfo(p){
            const n=Math.max(0,Number(p?.existencia||0)||0);
            if(!p?.disponible||n<=0)return{label:'AGOTADO',className:'is-out',modal:'Producto agotado por el momento.'};
            if(p?.existenciaConocida&&n===1)return{label:'ÚLTIMA PIEZA DISPONIBLE',className:'is-low',modal:'Última pieza disponible'};
            if(p?.existenciaConocida&&n===2)return{label:'ÚLTIMAS 2 PZS DISPONIBLES',className:'is-low',modal:'Últimas 2 piezas disponibles'};
            return{label:'Disponible',className:'',modal:p?.existenciaConocida?`Disponibles: ${n}`:'Disponible'};
          }
          function stockLimit(p,current=0){
            const sistema=Math.max(0,MAX_ORDER_QTY-Number(current||0));
            if(!p?.existenciaConocida)return sistema;
            return Math.max(0,Math.min(sistema,Math.max(0,Number(p.existencia||0)-Number(current||0))));
          }
          function insufficientStockMessage(p,requested){
            const n=Math.max(0,Number(p?.existencia||0)||0);
            if(n<=0)return `${p?.nombre||'Este producto'} está agotado por el momento.`;
            return `No hay existencia suficiente de ${p?.nombre||'este producto'}. Solo ${n} pza${n===1?'':'s'} disponible${n===1?'':'s'}.`;
          }''')

          block('function renderProducts(){','function openQuantity(id){',r'''function renderProducts(){
            const list=filteredProducts(); const visible=list.slice(0,state.displayLimit); $('emptyState').hidden=!!list.length; if(!list.length) $('emptyMessage').textContent=state.products.length?'No encontramos coincidencias con esos filtros.':'No hay productos publicados por la farmacia.';
            $('productGrid').innerHTML=visible.map(p=>{const stock=stockInfo(p);return `<article class="product-card ${p.disponible?'':'is-out'}" data-product="${esc(p.id)}" tabindex="0" aria-disabled="${p.disponible?'false':'true'}"><span class="stock-badge ${stock.className}">${esc(stock.label)}</span><div class="product-image" data-image-slot="${esc(p.id)}">${productImage(p)}</div><div class="product-body"><div class="product-presentation">${esc(p.presentacion||categoryOf(p)||'Producto')}</div><h2 class="product-name">${esc(p.nombre||'Producto')}</h2>${isAntibiotic(p)?'<span class="rx-badge">⚕ Receta requerida</span>':''}<div class="product-bottom"><strong class="product-price">${money(p.precio)}</strong><button class="add-mini" type="button" data-add="${esc(p.id)}" aria-label="${p.disponible?'Agregar':'Agotado'} ${esc(p.nombre)}" ${p.disponible?'':'disabled'}>${p.disponible?'+':'—'}</button></div></div></article>`}).join('');
            queueRealImages(visible);
            const more=$('loadMoreProducts'); const rest=Math.max(0,list.length-visible.length); more.hidden=rest===0; more.textContent=rest?`Mostrar más · ${rest.toLocaleString('es-MX')} restantes`:'Mostrar más productos';
          }''')

          block('function openQuantity(id){','function persistCart(){',r'''function openQuantity(id){ const p=state.productMap.get(id); if(!p)return; if(!p.disponible){toast(`${p.nombre}: AGOTADO. Este producto sigue en el catálogo porque la farmacia lo maneja, pero por ahora no tiene existencias.`);return;} state.selected=p; $('quantityImage').innerHTML=productImage(p); $('quantityPresentation').textContent=p.presentacion||categoryOf(p)||'Producto'; $('quantityTitle').textContent=p.nombre; const stock=stockInfo(p); $('quantityStock').textContent=stock.modal; $('quantityStock').classList.toggle('is-out',stock.className==='is-out'); $('quantityStock').classList.toggle('is-low',stock.className==='is-low'); $('quantityPrice').textContent=money(p.precio); $('quantityRxNotice').hidden=!isAntibiotic(p); const current=state.cart.get(p.id)?.cantidad||0; const max=stockLimit(p,current); $('qtyInput').max=String(Math.max(1,max)); $('qtyInput').value='1'; $('quantityModal').hidden=false; document.body.style.overflow='hidden'; }
          function closeModal(id){ $(id).hidden=true; if($('quantityModal').hidden&&$('checkoutModal').hidden&&$('successModal').hidden&&$('cartDrawer').hidden&&$('historyDrawer').hidden) document.body.style.overflow=''; }
          function selectedMax(){ if(!state.selected)return 1; const current=state.cart.get(state.selected.id)?.cantidad||0; return Math.max(1,stockLimit(state.selected,current)); }
          function adjustQty(delta){ const max=selectedMax(); const wanted=(Number($('qtyInput').value)||1)+delta; if(wanted>max){toast(insufficientStockMessage(state.selected,wanted));$('qtyInput').value=String(max);return;} $('qtyInput').value=String(clamp(wanted,1,max)); }
          function addSelected(){ const p=state.selected;if(!p||!p.disponible){toast('Este producto está agotado por el momento.');return;} const current=state.cart.get(p.id)?.cantidad||0; const max=stockLimit(p,current); const requested=Math.max(1,Math.floor(Number($('qtyInput').value)||1)); if(max<=0||requested>max){toast(insufficientStockMessage(p,current+requested));$('qtyInput').value=String(Math.max(1,max));return;} const qty=Math.min(requested,max); state.cart.set(p.id,{...p,cantidad:current+qty}); persistCart(); renderCart(); closeModal('quantityModal'); toast(`${qty} pza${qty===1?'':'s'} agregada${qty===1?'':'s'} al carrito${p.existenciaConocida&&p.existencia-current-qty<=2&&p.existencia-current-qty>0?' · quedan pocas piezas':''}`); }''')

          block('function persistCart(){','function loadCart(){',r'''function persistCart(){
            writeJsonStorage(STORAGE_CART,Array.from(state.cart.values()).map(i=>({id:i.id,cantidad:i.cantidad,codigo:i.codigo,nombre:i.nombre,presentacion:i.presentacion,precio:i.precio,departamento:i.departamento,tipoImagen:i.tipoImagen,imagenUrl:i.imagenUrl,generica:i.generica,distintiva:i.distintiva,disponible:i.disponible,activo:i.activo,existencia:i.existencia,existenciaConocida:i.existenciaConocida})));
          }''')

          block('function reconcileCart(){','function cartValues(){',r'''function reconcileCart(){
            let retirados=0,ajustados=0; for(const [id,item] of [...state.cart]){ const p=state.productMap.get(id); if(!p||!p.activo||!p.disponible){state.cart.delete(id);retirados++;continue;} const limite=p.existenciaConocida?Math.min(MAX_ORDER_QTY,Math.max(0,Number(p.existencia||0))):MAX_ORDER_QTY; if(limite<=0){state.cart.delete(id);retirados++;continue;} const cantidad=Math.min(Math.max(1,Number(item.cantidad)||1),limite); if(cantidad!==Number(item.cantidad))ajustados++; state.cart.set(id,{...p,cantidad}); }
            persistCart();renderCart(); if(retirados)toast(`${retirados} producto(s) fueron retirados del carrito porque ya están agotados.`); else if(ajustados)toast('Actualizamos cantidades del carrito a la existencia real disponible.');
          }''')

          block('function renderCart(){','function openHistory(){',r'''function renderCart(){
            const items=cartValues();const totals=cartTotals(); $('cartCount').textContent=totals.pieces;$('cartPieces').textContent=`${totals.pieces} pza${totals.pieces===1?'':'s'}`;$('cartTotal').textContent=money(totals.total);$('checkoutTotal').textContent=money(totals.total); $('checkoutButton').disabled=!items.length;
            $('cartItems').innerHTML=items.length?items.map(i=>{const stock=stockInfo(i);return `<div class="cart-row" data-cart="${esc(i.id)}"><div class="cart-thumb">${productImage(i)}</div><div class="cart-info"><strong>${esc(i.nombre)}</strong><small>${esc(i.presentacion||'')} ${i.existenciaConocida?`· ${esc(stock.modal)}`:''}</small><div class="cart-price">${money(Number(i.precio)*Number(i.cantidad))}</div></div><div class="cart-controls"><button type="button" data-cart-minus="${esc(i.id)}">−</button><b>${i.cantidad}</b><button type="button" data-cart-plus="${esc(i.id)}">+</button><button class="cart-remove" type="button" data-cart-remove="${esc(i.id)}">×</button></div></div>`}).join(''):'<div class="cart-empty"><div><div class="state-icon">🛒</div><strong>Tu carrito está vacío</strong><p>Selecciona un producto y elige la cantidad.</p></div></div>';
          }
          function changeCart(id,delta){const item=state.cart.get(id);if(!item)return;const p=state.productMap.get(id)||item;if(!p.disponible){state.cart.delete(id);persistCart();renderCart();toast('Producto agotado retirado del carrito.');return;}const next=Number(item.cantidad)+delta;if(next<=0){state.cart.delete(id);}else{const limite=p.existenciaConocida?Math.min(MAX_ORDER_QTY,Math.max(0,Number(p.existencia||0))):MAX_ORDER_QTY;if(next>limite){toast(insufficientStockMessage(p,next));return;}state.cart.set(id,{...item,...p,cantidad:next});}persistCart();renderCart();}''')

          old="for(const item of cartValues()){ const p=state.productMap.get(item.id); if(!p||!p.activo||!p.disponible) throw new Error(`${item.nombre}: aparece agotado. Retíralo del carrito para continuar.`); }"
          new="for(const item of cartValues()){ const p=state.productMap.get(item.id); if(!p||!p.activo||!p.disponible) throw new Error(`${item.nombre}: aparece AGOTADO. Retíralo del carrito para continuar.`); if(p.existenciaConocida&&Number(item.cantidad)>Number(p.existencia||0)) throw new Error(insufficientStockMessage(p,item.cantidad)); }"
          if old not in s: raise SystemExit('No se encontro validacion final de stock')
          s=s.replace(old,new,1)

          old="$('qtyInput').addEventListener('change',()=>{$('qtyInput').value=String(clamp($('qtyInput').value,1,selectedMax()))});"
          new="$('qtyInput').addEventListener('change',()=>{const max=selectedMax(),wanted=Math.max(1,Math.floor(Number($('qtyInput').value)||1));if(wanted>max){toast(insufficientStockMessage(state.selected,wanted));$('qtyInput').value=String(max);}else $('qtyInput').value=String(clamp(wanted,1,max));});"
          if old not in s: raise SystemExit('No se encontro listener de cantidad')
          s=s.replace(old,new,1)

          path.write_text(s,encoding='utf-8')
      - name: Validar cambios
        run: |
          grep -q "ÚLTIMA PIEZA DISPONIBLE" docs/index.html
          grep -q "ÚLTIMAS 2 PZS DISPONIBLES" docs/index.html
          grep -q "No hay existencia suficiente" docs/index.html
          grep -q "existenciaConocida" docs/index.html
      - name: Publicar cambios
        run: |
          git config user.name "Macroxel Update"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Muestra stock real, agotados y ultimas piezas" || exit 0
          git push origin main
