name: Validar publicación Mi Farmacia

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/mi-farmacia.css'
      - 'docs/mi-farmacia.js'
      - 'docs/macroxel-config.json'
      - 'docs/catalogo-imagenes.json'
      - 'docs/image-bot/**'
      - '.github/workflows/validate-on-push.yml'

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validar estructura y JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/mi-farmacia.css
          test -f docs/mi-farmacia.js
          test -f docs/macroxel-config.json
          test -f docs/catalogo-imagenes.json
          test -f docs/image-bot/package.json
          test -f docs/image-bot/sync-product-images.mjs
          grep -q 'mi-farmacia.css?v=170' docs/index.html
          grep -q 'mi-farmacia.js?v=170' docs/index.html
          grep -q "new URL('macroxel-config.json',document.baseURI)" docs/mi-farmacia.js
          grep -q 'mi_farmacia/catalogo/' docs/mi-farmacia.js
          grep -q 'renderProducts' docs/mi-farmacia.js
          node --check docs/mi-farmacia.js
          node --check docs/image-bot/sync-product-images.mjs

      - name: Probar Firebase y guardar resultado
        shell: python
        run: |
          import json, urllib.request, urllib.parse, datetime
          from pathlib import Path
          cfg=json.loads(Path('docs/macroxel-config.json').read_text(encoding='utf-8'))
          assert int(cfg.get('version',0)) >= 2
          base=str(cfg.get('firebaseUrl','')).rstrip('/')
          store=str(cfg.get('tiendaId','')).strip()
          assert base.startswith('https://') and store
          def get(path):
              url=f"{base}/{path.strip('/')}.json"
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'Macroxel-GitHub-Validation/1.0'})
              with urllib.request.urlopen(req,timeout=40) as r:
                  raw=r.read().decode('utf-8')
                  assert r.status==200
                  return json.loads(raw) if raw else None
          tienda=get(f"mi_farmacia/tiendas/{urllib.parse.quote(store,safe='')}") or {}
          meta=get(f"mi_farmacia/catalogo/{urllib.parse.quote(store,safe='')}/meta") or {}
          productos=get(f"mi_farmacia/catalogo/{urllib.parse.quote(store,safe='')}/productos") or {}
          assert isinstance(tienda,dict) and tienda
          assert isinstance(meta,dict) and int(meta.get('version',0))==2
          revision=int(meta.get('revision',0) or 0)
          assert revision>0
          assert isinstance(productos,dict) and len(productos)>0
          assert str(tienda.get('clavePedidosId','')).strip()
          assert str(tienda.get('claveFirmaCatalogoId','')).strip()
          assert isinstance(tienda.get('clavePublicaFirmaCatalogo'),dict)
          firma=meta.get('firmaCatalogo') or {}
          assert isinstance(firma,dict) and firma.get('value')
          Path('VALIDATION_RESULT.txt').write_text(
              'RESULT=OK\n'
              f'PRODUCTOS={len(productos)}\n'
              f'REVISION={revision}\n'
              f'TIENDA={store}\n'
              f'VALIDATED_AT={datetime.datetime.now(datetime.timezone.utc).isoformat()}\n',
              encoding='utf-8'
          )

      - name: Publicar resultado de validación
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VALIDATION_RESULT.txt
          git commit -m "VALIDACION OK Mi Farmacia: catálogo y conexión"
          git push
