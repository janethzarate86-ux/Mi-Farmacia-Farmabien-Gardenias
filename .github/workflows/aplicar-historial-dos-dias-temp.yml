name: Aplicar historial hoy y ayer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aplicar-historial-dos-dias-temp.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar historial de dos días
        run: python tools/patch_history_two_days_temp.py
      - name: Guardar cambios
        run: |
          git config user.name "Macroxel Update"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios pendientes"
          else
            git commit -m "Limita historial del visor a hoy y ayer"
            git push
          fi
