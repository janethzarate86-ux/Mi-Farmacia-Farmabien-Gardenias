name: Macroxel Mi Farmacia hotfix

on:
  push:
    paths:
      - '.github/workflows/macroxel-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-firebase-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir URL REST de Firebase
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          old = "const query = split[1] ? `?${split[1]}&ts=${Date.now()}` : `?ts=${Date.now()}`;"
          new = "const query = split[1] ? `?${split[1]}` : '';"
          if old not in s:
              raise SystemExit('No se encontro el bloque Firebase esperado')
          s = s.replace(old, new, 1)
          old2 = "const options = {method,headers:{Accept:'application/json'}};"
          new2 = "const options = {method,cache:'no-store',headers:{Accept:'application/json'}};"
          if old2 not in s:
              raise SystemExit('No se encontro el bloque request esperado')
          s = s.replace(old2, new2, 1)
          s = s.replace('single-file-v1.6.2-fast-bootstrap-v1.7.0-orders-status-delivery', 'single-file-v1.6.2-fast-bootstrap-v1.7.1-firebase-rest-orders-status-delivery', 1)
          p.write_text(s, encoding='utf-8')
      - name: Guardar correccion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corregir carga del catalogo Firebase en Mi Farmacia"
          git push
