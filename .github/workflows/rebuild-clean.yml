name: Reconstruir Mi Farmacia limpia

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruir, corregir y probar antes de publicar
        shell: python
        run: |
          from pathlib import Path
          import json, re, shutil, subprocess, tempfile, urllib.request, urllib.parse

          root = Path('.')
          src_index = root / 'index.html'
          src_config = root / 'macroxel-config.json'
          if not src_index.exists():
              raise RuntimeError('Falta index.html de respaldo en la raíz.')
          if not src_config.exists():
              raise RuntimeError('Falta macroxel-config.json de respaldo en la raíz.')

          cfg = json.loads(src_config.read_text(encoding='utf-8'))
          for key in ('firebaseUrl','githubUrl','tiendaId'):
              if not str(cfg.get(key,'')).strip():
                  raise RuntimeError('Configuración incompleta: ' + key)

          s = src_index.read_text(encoding='utf-8')

          # Volver al esquema estable: index + macroxel-config.json separados dentro de /docs.
          s = re.sub(r'\s*<script id="macroxel-runtime-config" type="application/json">.*?</script>\s*', '\n', s, count=1, flags=re.S)
          embedded = "const u={href:'data:application/json;charset=utf-8,'+encodeURIComponent(document.getElementById('macroxel-runtime-config').textContent)};"
          external = "const u=new URL('macroxel-config.json',document.baseURI);"
          if embedded in s:
              s = s.replace(embedded, external, 1)
          elif external not in s:
              raise RuntimeError('No se pudo restaurar la lectura de macroxel-config.json.')

          # Error real detectado en navegador: la función era llamada pero no existía.
          if 'function loadCatalogCache()' not in s:
              needle = "  function saveCatalogCache(productos,meta){\n    writeJsonStorage(STORAGE_CATALOG,{version:2,storeId:state.storeId,revision:Number(meta?.revision||0)||0,baseRevision:Number(meta?.baseRevision||0)||0,actualizadoEn:text(meta?.actualizadoEn),productos});\n  }\n"
              if needle not in s:
                  raise RuntimeError('No se encontró saveCatalogCache para aplicar la corrección.')
              add = needle + "  function loadCatalogCache(){\n    const cached=readJsonStorage(STORAGE_CATALOG,null);\n    if(!cached||typeof cached!=='object')return null;\n    if(!cached.productos||typeof cached.productos!=='object')return null;\n    return cached;\n  }\n"
              s = s.replace(needle, add, 1)

          # Firebase RTDB: no agregar parámetros de caché desconocidos a las URLs REST.
          old = "    const split = base.split('?');\n    const root = split[0].replace(/\\/+$/,'');\n    const query = split[1] ? `?${split[1]}&ts=${Date.now()}` : `?ts=${Date.now()}`;\n    return `${root}/${String(path||'').replace(/^\\/+|\\/+$/g,'')}.json${query}`;"
          new = "    const split = base.split('?');\n    const root = split[0].replace(/\\/+$/,'');\n    const query = split[1] ? `?${split[1]}` : '';\n    return `${root}/${String(path||'').replace(/^\\/+|\\/+$/g,'')}.json${query}`;"
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace("const options = {method,headers:{Accept:'application/json'}};", "const options = {method,cache:'no-store',headers:{Accept:'application/json'}};", 1)
          s = re.sub(r'(<meta name="mi-farmacia-build" content=")[^"]+("[^>]*>)', r'\1single-file-v1.7.1-clean-runtime\2', s, count=1)

          clean = Path(tempfile.mkdtemp(prefix='macroxel-clean-'))
          docs = clean / 'docs'
          (docs / 'image-bot').mkdir(parents=True, exist_ok=True)
          (docs / 'assets' / 'products').mkdir(parents=True, exist_ok=True)
          (clean / '.github' / 'workflows').mkdir(parents=True, exist_ok=True)

          (docs / 'index.html').write_text(s, encoding='utf-8')
          (docs / 'macroxel-config.json').write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (docs / '.nojekyll').write_text('', encoding='utf-8')

          # Solo conservar archivos funcionales del catálogo de imágenes.
          catalog = root / 'catalogo-imagenes.json'
          if catalog.exists():
              shutil.copy2(catalog, docs / 'catalogo-imagenes.json')
          else:
              (docs / 'catalogo-imagenes.json').write_text('{"version":1,"products":{}}\n', encoding='utf-8')

          bot = root / 'image-bot'
          if not bot.exists():
              bot = root / 'docs' / 'image-bot'
          for name in ('package.json','sync-product-images.mjs'):
              src = bot / name
              if not src.exists():
                  raise RuntimeError('Falta archivo del bot: ' + str(src))
              shutil.copy2(src, docs / 'image-bot' / name)

          assets = root / 'assets' / 'products'
          if not assets.exists():
              assets = root / 'docs' / 'assets' / 'products'
          if assets.exists():
              for f in assets.iterdir():
                  if f.is_file() and f.suffix.lower() in ('.jpg','.jpeg','.png','.webp'):
                      shutil.copy2(f, docs / 'assets' / 'products' / f.name)

          workflow = """name: Macroxel - Catalogo automatico de imagenes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-product-images.yml'
      - 'docs/macroxel-config.json'
      - 'docs/image-bot/**'
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: macroxel-image-catalog
  cancel-in-progress: false

jobs:
  sync-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix docs/image-bot --no-audit --no-fund
      - env:
          MAX_IMAGE_LOOKUPS: '120'
        run: node docs/image-bot/sync-product-images.mjs
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalogo-imagenes.json docs/assets/products
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: actualizar catalogo automatico de imagenes"
          git push
"""
          (clean / '.github' / 'workflows' / 'sync-product-images.yml').write_text(workflow, encoding='utf-8')

          # PRUEBA 1: sintaxis real de todos los bloques JavaScript del visor.
          blocks = re.findall(r'<script([^>]*)>(.*?)</script>', s, flags=re.S|re.I)
          checked = 0
          for i,(attrs,code) in enumerate(blocks):
              if 'application/json' in attrs.lower() or not code.strip():
                  continue
              js = clean / ('check-%d.js' % i)
              js.write_text(code, encoding='utf-8')
              cp = subprocess.run(['node','--check',str(js)], text=True, capture_output=True)
              if cp.returncode != 0:
                  raise RuntimeError('JavaScript inválido: ' + (cp.stderr or cp.stdout)[-1500:])
              js.unlink()
              checked += 1
          if checked < 1:
              raise RuntimeError('No se validó ningún bloque JavaScript.')
          if 'function loadCatalogCache()' not in s:
              raise RuntimeError('loadCatalogCache sigue ausente.')
          if '?ts=${Date.now()}' in s:
              raise RuntimeError('La URL Firebase todavía agrega ?ts.')
          if "new URL('macroxel-config.json',document.baseURI)" not in s:
              raise RuntimeError('El visor no quedó enlazado a macroxel-config.json.')

          # PRUEBA 2: conexión real a Firebase con la configuración que se publicará.
          base = str(cfg['firebaseUrl']).rstrip('/')
          store = str(cfg['tiendaId']).strip()
          def get(path):
              url = base + '/' + path.strip('/') + '.json'
              req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'Macroxel-Validation/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read().decode('utf-8')
                  if r.status != 200:
                      raise RuntimeError('HTTP %s en %s' % (r.status,path))
                  return json.loads(raw) if raw else None
          tienda = get('mi_farmacia/tiendas/' + urllib.parse.quote(store, safe='')) or {}
          meta = get('mi_farmacia/catalogo/' + urllib.parse.quote(store, safe='') + '/meta') or {}
          productos = get('mi_farmacia/catalogo/' + urllib.parse.quote(store, safe='') + '/productos') or {}
          count = len(productos) if isinstance(productos, dict) else 0
          revision = int(meta.get('revision') or 0) if isinstance(meta, dict) else 0
          if not tienda:
              raise RuntimeError('Firebase respondió tienda vacía.')
          if count < 1:
              raise RuntimeError('Firebase respondió catálogo sin productos.')
          if revision < 1:
              raise RuntimeError('Firebase respondió catálogo sin revisión.')
          print('VALIDACION_OK productos=%d revision=%d js_blocks=%d' % (count, revision, checked))

          # Guardar ruta para el siguiente paso solo después de pasar TODAS las pruebas.
          Path('/tmp/macroxel-clean-path').write_text(str(clean), encoding='utf-8')

      - name: Sustituir todo el repositorio por la versión limpia validada
        shell: bash
        run: |
          CLEAN="$(cat /tmp/macroxel-clean-path)"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$CLEAN"/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mi Farmacia limpia validada: restaurar carga de catálogo"
          git push
